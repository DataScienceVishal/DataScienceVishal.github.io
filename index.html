<!doctype html>
<html lang="en-GB" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0f19" />

    <title>Vishal Khan - AI and ML Engineer, London</title>
    <meta
      name="description"
      content="AI and ML engineer in London. Finance and taxation from 2018 to 2021, then Databricks pipelines at Teleperformance, now working on agent reliability. Every claim on this page carries its source."
    />
    <meta name="author" content="Vishal Khan" />
    <!--
      After the first deploy, set SITE_URL below to the live origin and make the
      canonical and og:image URLs absolute. Relative og:image works in some
      scrapers and not in others, LinkedIn among them.
      SITE_URL: https://<your-domain>
    -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link
      rel="preload"
      href="/fonts/bricolage-grotesque-latin-wdth-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <!--
      The hero figure's still. It is the largest contentful paint on every
      viewport, and without this it queued behind the main bundle: on a
      throttled phone it started at 645ms and finished at 2.4s, entirely
      because 355 kB of JavaScript was ahead of it on the wire. It is in the
      prerendered markup, but the preload scanner reaches this line first.
    -->
    <link
      rel="preload"
      href="/hero-figure.webp"
      as="image"
      type="image/webp"
      fetchpriority="high"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vishal Khan" />
    <meta property="og:title" content="Vishal Khan - AI and ML Engineer, London" />
    <meta
      property="og:description"
      content="A number nobody can check is not a number. AI and ML engineer in London, looking for an AI or ML internship now and full time from January 2027."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Vishal Khan. A number nobody can check is not a number. AI and ML engineer in London."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vishal Khan - AI and ML Engineer, London" />
    <meta
      name="twitter:description"
      content="AI and ML engineer in London. Every claim on this page carries its source."
    />
    <meta name="twitter:image" content="/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
