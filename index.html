<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Before anything paints: the theme, so a dark-mode reader never sees a
      flash of daylight, and the js class, so controls that need script can
      hide themselves where there is none. Stored choice first, then the OS.
    -->
    <script>
      (function () {
        var d = document.documentElement;
        var t = null;
        try { t = localStorage.getItem("theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        d.setAttribute("data-theme", t);
        d.classList.add("js");
      })();
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />

    <title>Vishal Khan - AI and ML engineer, London</title>
    <meta
      name="description"
      content="AI and ML engineer in London who checks the numbers: a benchmark scorer audit, a pipeline rerun checker and a live RAG twin. Internship now, full time from 2027."
    />
    <meta name="author" content="Vishal Khan" />
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1"
    />
    <!-- Cross-origin referrers get the origin only, same-origin gets the path. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!--
      Absolute, not root-relative. The page is reachable at vishalkhan.me and at
      datasciencevishal.github.io, and LinkedIn's scraper does not resolve a
      relative og:image at all, so a shared link rendered as an empty grey card.
      This is the channel the URL actually travels through.
    -->
    <link rel="canonical" href="https://vishalkhan.me/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link
      rel="preload"
      href="/fonts/archivo-latin-wdth-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/atkinson-hyperlegible-next-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://vishalkhan.me/" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:site_name" content="Vishal Khan" />
    <meta
      property="og:title"
      content="Vishal Khan - AI and ML engineer, London"
    />
    <meta
      property="og:description"
      content="I build AI systems, and I check the numbers before I believe them. AI and ML engineer in London: an AI or ML internship now, full time from early 2027, with no sponsorship needed for the first 18 months."
    />
    <meta property="og:image" content="https://vishalkhan.me/og-image.jpg" />

    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Vishal Khan. I build AI systems, and I check the numbers before I believe them. AI and ML engineer in London."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Vishal Khan - AI and ML engineer, London"
    />
    <meta
      name="twitter:description"
      content="I build AI systems, and I check the numbers before I believe them. AI and ML engineer in London: an AI or ML internship now, full time from early 2027, with no sponsorship needed for the first 18 months."
    />
    <meta name="twitter:image" content="https://vishalkhan.me/og-image.jpg" />

    <!--
      "Vishal Khan" is a common name. This is what lets a search engine bind
      the string to this particular person, his university and his profiles,
      rather than guessing. Every field restates something already on the page.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Vishal Khan",
        "url": "https://vishalkhan.me/",
        "image": "https://vishalkhan.me/og-image.jpg",
        "jobTitle": "AI and ML engineer",
        "description": "AI and ML engineer in London. Builds AI systems and audits the numbers reported about them: benchmark scorers, pipeline nondeterminism, dataset leakage.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "London",
          "addressCountry": "GB"
        },
        "alumniOf": [
          {
            "@type": "CollegeOrUniversity",
            "name": "Northeastern University London",
            "url": "https://www.nulondon.ac.uk/"
          },
          {
            "@type": "CollegeOrUniversity",
            "name": "Liverpool John Moores University",
            "url": "https://www.ljmu.ac.uk/"
          },
          {
            "@type": "CollegeOrUniversity",
            "name": "University of Delhi",
            "url": "https://www.du.ac.in/"
          }
        ],
        "knowsAbout": [
          "Agent reliability",
          "AI evaluation",
          "Benchmark auditing",
          "Retrieval-augmented generation",
          "Machine learning",
          "Data engineering",

        ],
        "sameAs": [
          "https://github.com/DataScienceVishal",
          "https://www.linkedin.com/in/vishalkhandatascience/"
        ]
      }
    </script>
  </head>
  <body>

  </body>
</html>
