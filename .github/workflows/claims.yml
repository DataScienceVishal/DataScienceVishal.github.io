name: claims

# The figures on the page quote READMEs, a repository description and a live
# endpoint, and any of those can change without this repo hearing about it.
# Once a week this checks that each source still says what the page says, then
# checks every link on the built page.
#
# GitHub disables scheduled workflows in a public repository after 60 days
# without activity. If the repo goes quiet that long, re-enable this from the
# Actions tab.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned to a commit, not a tag. A tag can be moved to other
# code at any time, and the link check runs a third party's action in a job
# that holds this repository's token. The comment beside each pin is the
# release it was taken from.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - id: install
        run: npm ci

      # Bundled without the token: this step runs Vite and its plugins, and
      # none of that code has any reason to see it.
      - run: npm run claims:build

      # Only the check itself gets the token, and it sends it to api.github.com
      # and nowhere else.
      - run: npm run claims:check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Run the link check even when a claim has drifted, so a week with both
      # problems reports both. It still needs the install to have worked.
      - id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # lychee.toml is written for this version. 0.24 changed how
          # include_fragments is spelled, so a different binary could reject it.
          lycheeVersion: v0.24.2
          # The page links to its fonts, script, images and the CV as root
          # paths like /fonts/..., and without --root-dir lychee reports every
          # one of them as broken.
          args: --config lychee.toml --no-progress --root-dir ${{ github.workspace }}/dist dist/index.html
          fail: true
