name: deploy

on:
  push:
    branches: [main]
  # So a deploy can be re-run from the Actions tab without a new commit.
  workflow_dispatch:

# The token this grants is what the deploy step authenticates with. Pages needs
# both: `pages` to publish and `id-token` for the deployment's provenance.
permissions:
  contents: read
  pages: write
  id-token: write

# Actions are pinned to commits rather than tags, because a tag can be moved to
# other code and this job can publish the site. The comment beside each pin is
# the release it was taken from.

# Never run two deploys at once. A queued run is allowed to wait, but is not
# cancelled, so the last push to land is the one that ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Typecheck separately from the build. Vite does not typecheck, so
      # without this a type error ships as a working page with a broken part.
      - run: npx tsc -b

      - run: npm run build

      # The browser suite runs against this same build, through the preview
      # server playwright.config.ts starts, and a failure stops the deploy.
      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  # Lighthouse on the built page, three runs. It reports rather than blocks:
  # scores move between runners, and a deploy should not wait on one that is
  # having a slow minute. The thresholds it reports against are in
  # lighthouserc.json.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run lhci
        continue-on-error: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5